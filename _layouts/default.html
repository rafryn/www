<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.opis | default: site.description }}">
  {% if site.wersja_testowa %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% if site.wersja_testowa %}
  <div class="test-bar">Wersja testowa do akceptacji Zarządu · treści w [nawiasach] do uzupełnienia</div>
  {% endif %}
  {% include header.html %}
  <main id="tresc">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
