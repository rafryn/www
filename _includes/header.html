<a class="skip" href="#tresc">Przejdź do treści</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo/copernicus-full-black.png' | relative_url }}" alt="Copernicus – Akademia Michała Kwiatkowskiego" width="340" height="60">
    </a>
    <nav class="nav" aria-label="Menu główne">
      {% for p in site.data.menu %}
        {% if p.adres contains "#" %}
          <a href="{{ p.adres }}">{{ p.nazwa }}</a>
        {% else %}
          {% assign aktywna = false %}{% if page.url contains p.adres %}{% assign aktywna = true %}{% endif %}
          <a href="{{ p.adres | relative_url }}"{% if aktywna %} aria-current="page"{% endif %}>{{ p.nazwa }}</a>
        {% endif %}
      {% endfor %}
      <a class="btn btn-orange btn-sm" href="{{ '/zapisy/' | relative_url }}"{% if page.url contains '/zapisy/' %} aria-current="page"{% endif %}>Zapisy</a>
    </nav>
  </div>
</header>
