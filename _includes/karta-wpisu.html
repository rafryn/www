<article class="card">
  <a href="{{ include.post.url | relative_url }}">
    <img src="{{ include.post.zdjecie | relative_url }}" alt="{{ include.post.zdjecie_opis }}" loading="lazy">
    <span class="meta">{{ include.post.kategoria }} · {% if include.post.data_do_uzupelnienia %}[data]{% else %}{% include data.html d=include.post.date %}{% endif %}</span>
    <span class="card-title">{{ include.post.title }}</span>
  </a>
</article>
